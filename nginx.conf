# 비루트(nginx 사용자)로 실행하기 위한 전체 설정. 80 포트 대신 8080을 쓴다.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 비루트가 쓸 수 있도록 임시 경로를 /tmp 로 옮긴다.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # 보안 헤더 (always: 에러 응답에도 적용)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "nfc=(self), camera=(self), microphone=(), geolocation=()" always;
    # TODO: Firebase / API 게이트웨이 / 이미지(imgproxy) 도메인 확정 후 아래 항목에 추가
    #   connect-src : API 게이트웨이, https://identitytoolkit.googleapis.com, https://securetoken.googleapis.com, FCM
    #   img-src     : imgproxy 도메인
    #   frame-src   : Firebase Auth 팝업 로그인을 쓰면 https://<authDomain>
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA fallback
    location / {
      try_files $uri /index.html;
    }

    # 해시 파일명 정적 자원: 장기 캐시.
    # location 안에 add_header 를 쓰면 server 수준 보안 헤더 상속이 끊기므로 expires 만 쓴다.
    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }

    # 진입점과 서비스 워커는 항상 재검증
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
      expires -1;
    }
  }
}
