version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - "chore 🔧"
      - "area: infra 🐳"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    commit-message:
      prefix: chore(ci)
    labels:
      - "chore 🔧"
      - "area: infra 🐳"
