name: 🔧 작업 (Task)
description: 설정, 리팩터링, 문서 등 기능 외 작업
title: "[CHORE] "
labels: ["chore 🔧"]
body:
  - type: markdown
    attributes:
      value: |
        기능 외 작업을 등록합니다. 제목은 `[CHORE] 요약` 형식으로 씁니다.
        리팩터링이면 `[REFACTOR]`, 문서면 `[DOCS]`로 제목을 바꾸고 라벨도 맞춰 주세요.

  - type: textarea
    id: what
    attributes:
      label: 📌 작업 내용
      placeholder: 예) ESLint 설정 추가
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 💡 이유 / 배경

  - type: textarea
    id: todo
    attributes:
      label: ✅ 할 일
      value: |
        - [ ]
        - [ ]
