name: 버그 제보
description: 의도와 다르게 동작하는 문제
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 현상
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      description: 기기, OS, 브라우저 (예 Galaxy S23 / Android 14 / Chrome)
  - type: textarea
    id: log
    attributes:
      label: 로그·스크린샷
      description: 토큰, 개인정보는 가리고 첨부
